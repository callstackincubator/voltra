<!DOCTYPE html>
<!--
  The social card (1200x630) and, with ?format=banner, the README banner (1660x512).
  scripts/og.mjs serves the website folder, opens this page in Chromium and saves screenshots
  to public/og-image.jpg and public/banner.jpg. Edit the layout here, then run `pnpm og`.

  Facts and colours are not written here: the script serves content.ts as /og/site.json and
  brand.ts as /og/brand.css, and the page fills itself in from them.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/og/brand.css" />
    <style>
      @font-face {
        font-family: 'Switzer';
        src: url('/src/fonts/Switzer-Medium.woff2') format('woff2');
        font-weight: 500;
      }
      @font-face {
        font-family: 'Geist Mono';
        src: url('/src/fonts/GeistMono-Regular.woff2') format('woff2');
        font-weight: 400;
      }
      :root {
        --line: rgb(255 255 255 / 0.1);
        --line-strong: rgb(255 255 255 / 0.2);
        --muted: rgb(255 255 255 / 0.62);
        --faint: rgb(255 255 255 / 0.5);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0a0a0a;
        color: #fff;
        font-family: 'Switzer', sans-serif;
      }
      .card {
        position: absolute;
        inset: 0 48px;
        border-inline: 1px solid var(--line);
      }
      .top {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 52px 56px 0;
      }
      .mark {
        height: 40px;
        margin-right: 4px;
        color: var(--accent);
      }
      .wordmark {
        padding: 2px 9px;
        background: var(--accent);
        color: #0a0a0a;
        font-weight: 500;
        font-size: 34px;
        line-height: 1.2;
        text-transform: uppercase;
      }
      .mono {
        font-family: 'Geist Mono', monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .by {
        padding: 6px 10px;
        background: #1a1a1a;
        color: var(--faint);
        font-size: 15px;
      }
      h1 {
        margin: 32px 56px 0;
        max-width: 1000px;
        font-weight: 500;
        font-size: 70px;
        line-height: 1.04;
        letter-spacing: -0.035em;
      }
      h1 em {
        display: block;
        font-style: normal;
        color: var(--accent);
      }
      .band {
        position: absolute;
        inset: auto 0 0;
        height: 250px;
        border-top: 1px solid var(--line);
      }
      canvas {
        image-rendering: pixelated;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .windows {
        position: absolute;
        left: 56px;
        top: 34px;
        display: flex;
        gap: 24px;
      }
      .window {
        background: #0a0a0a;
        border: 1px solid var(--line-strong);
        font-family: 'Geist Mono', monospace;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 14px;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
        color: var(--faint);
      }
      .tag {
        padding: 0 4px;
        background: var(--accent);
        color: #0a0a0a;
        font-family: 'Switzer', sans-serif;
        font-size: 12px;
        text-transform: uppercase;
      }
      /* The order tracker as both platforms show it, drawn in the site's language. */
      .la {
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 330px;
        padding: 18px 20px 20px;
        font-family: 'Switzer', sans-serif;
      }
      .car {
        width: 27px;
        height: 27px;
        margin-bottom: 6px;
        color: var(--accent);
      }
      .la-title {
        font-size: 26px;
        font-weight: 500;
        letter-spacing: -0.015em;
      }
      .la-sub {
        font-size: 18px;
        color: var(--muted);
      }
      .accent {
        color: var(--accent);
      }
      .out {
        color: var(--muted);
      }
      .platforms {
        position: absolute;
        right: 56px;
        bottom: 24px;
        padding: 6px 10px;
        background: #0a0a0a;
        font-size: 14px;
        color: var(--muted);
      }

      /* The README banner: copy on the left, the picture on the scene on the right. */
      body[data-format='banner'] {
        width: 1245px;
        height: 384px;
      }
      /* No frame hairlines: on GitHub they read as a stray border. */
      [data-format='banner'] .card {
        inset: 0;
        border-inline: 0;
      }
      [data-format='banner'] .top {
        padding: 44px 64px 0;
      }
      [data-format='banner'] h1 {
        margin: 28px 64px 0;
        max-width: 560px;
        font-size: 44px;
      }
      [data-format='banner'] .band {
        inset: 0 0 0 600px;
        height: auto;
        border-top: 0;
        border-left: 1px solid var(--line);
      }
      [data-format='banner'] .windows {
        left: 40px;
        top: 50%;
        translate: 0 -50%;
        flex-direction: column;
        gap: 16px;
      }
      [data-format='banner'] .la {
        width: 300px;
        gap: 4px;
        padding: 12px 18px 14px;
      }
      [data-format='banner'] .car {
        width: 18px;
        height: 18px;
        margin-bottom: 4px;
      }
      [data-format='banner'] .la-title {
        font-size: 20px;
      }
      [data-format='banner'] .la-sub {
        font-size: 15px;
      }
      [data-format='banner'] .platforms {
        left: -536px;
        right: auto;
        bottom: 40px;
        padding: 0;
        background: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="top">
        <svg class="mark" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true" hidden>
          <path />
        </svg>
        <span class="wordmark" data-wordmark></span>
        <span class="by mono">by Callstack</span>
      </div>
      <h1><span data-beat="0"></span> <em data-beat="1"></em></h1>
      <div class="band">
        <canvas id="dither"></canvas>
        <div class="windows">
          <!-- OG VISUAL: the hero's order tracker, on both platforms. -->
          <div class="window">
            <div class="bar"><span class="tag" data-wordmark></span>iOS · Live Activity</div>
            <div class="la">
              <svg class="car" viewBox="0 0 9 9" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true">
                <path
                  d="M2 1h1v1h-1zM3 1h1v1h-1zM4 1h1v1h-1zM5 1h1v1h-1zM6 1h1v1h-1zM1 2h1v1h-1zM7 2h1v1h-1zM0 3h1v1h-1zM1 3h1v1h-1zM2 3h1v1h-1zM3 3h1v1h-1zM4 3h1v1h-1zM5 3h1v1h-1zM6 3h1v1h-1zM7 3h1v1h-1zM8 3h1v1h-1zM0 4h1v1h-1zM1 4h1v1h-1zM2 4h1v1h-1zM3 4h1v1h-1zM4 4h1v1h-1zM5 4h1v1h-1zM6 4h1v1h-1zM7 4h1v1h-1zM8 4h1v1h-1zM0 5h1v1h-1zM2 5h1v1h-1zM3 5h1v1h-1zM4 5h1v1h-1zM5 5h1v1h-1zM6 5h1v1h-1zM8 5h1v1h-1zM0 6h1v1h-1zM1 6h1v1h-1zM2 6h1v1h-1zM3 6h1v1h-1zM4 6h1v1h-1zM5 6h1v1h-1zM6 6h1v1h-1zM7 6h1v1h-1zM8 6h1v1h-1zM1 7h1v1h-1zM2 7h1v1h-1zM6 7h1v1h-1zM7 7h1v1h-1z"
                />
              </svg>
              <span class="la-title">Driver arrived</span>
              <span class="la-sub">Ready for pickup</span>
            </div>
          </div>
          <div class="window">
            <div class="bar"><span class="tag" data-wordmark></span>Android · widget</div>
            <div class="la">
              <svg class="car" viewBox="0 0 9 9" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true">
                <path
                  d="M2 1h1v1h-1zM3 1h1v1h-1zM4 1h1v1h-1zM5 1h1v1h-1zM6 1h1v1h-1zM1 2h1v1h-1zM7 2h1v1h-1zM0 3h1v1h-1zM1 3h1v1h-1zM2 3h1v1h-1zM3 3h1v1h-1zM4 3h1v1h-1zM5 3h1v1h-1zM6 3h1v1h-1zM7 3h1v1h-1zM8 3h1v1h-1zM0 4h1v1h-1zM1 4h1v1h-1zM2 4h1v1h-1zM3 4h1v1h-1zM4 4h1v1h-1zM5 4h1v1h-1zM6 4h1v1h-1zM7 4h1v1h-1zM8 4h1v1h-1zM0 5h1v1h-1zM2 5h1v1h-1zM3 5h1v1h-1zM4 5h1v1h-1zM5 5h1v1h-1zM6 5h1v1h-1zM8 5h1v1h-1zM0 6h1v1h-1zM1 6h1v1h-1zM2 6h1v1h-1zM3 6h1v1h-1zM4 6h1v1h-1zM5 6h1v1h-1zM6 6h1v1h-1zM7 6h1v1h-1zM8 6h1v1h-1zM1 7h1v1h-1zM2 7h1v1h-1zM6 7h1v1h-1zM7 7h1v1h-1z"
                />
              </svg>
              <span class="la-title">Driver arrived</span>
              <span class="la-sub">Ready for pickup</span>
            </div>
          </div>
          <!-- /OG VISUAL -->
        </div>
        <span class="platforms mono" data-platforms></span>
      </div>
    </div>
    <script type="module">
      import { drawDither } from '/og/dither.js'

      const site = await (await fetch('/og/site.json')).json()
      const banner = new URLSearchParams(location.search).get('format') === 'banner'
      if (banner) document.body.dataset.format = 'banner'

      for (const el of document.querySelectorAll('[data-wordmark]')) el.textContent = site.wordmark
      for (const el of document.querySelectorAll('[data-beat]')) el.textContent = site.headline[el.dataset.beat]
      document.querySelector('[data-platforms]').textContent = site.platforms.join(' · ')

      // The mark, on its own step grid, when the product has one.
      if (site.mark.length) {
        const svg = document.querySelector('.mark')
        const w = Math.max(...site.mark.map((r) => r.length))
        const h = site.mark.length
        svg.setAttribute('viewBox', `0 0 ${w} ${h}`)
        svg.style.width = `${(40 / h) * w}px`
        svg
          .querySelector('path')
          .setAttribute(
            'd',
            site.mark.flatMap((row, y) => [...row].map((c, x) => (c === '#' ? `M${x} ${y}h1v1h-1z` : ''))).join('')
          )
        svg.hidden = false
      }

      await document.fonts.ready

      // A long headline steps its size down until it clears what sits below it.
      const h1 = document.querySelector('h1')
      const below = document.querySelector(banner ? '[data-platforms]' : '.band')
      let size = parseFloat(getComputedStyle(h1).fontSize)
      while (h1.getBoundingClientRect().bottom > below.getBoundingClientRect().top - 20 && size > 28) {
        size -= 2
        h1.style.fontSize = `${size}px`
      }

      const canvas = document.getElementById('dither')
      const cols = Math.round(canvas.clientWidth / 2)
      const rows = Math.round(canvas.clientHeight / 2)
      drawDither(canvas, 'cells', 9, site.rgb, cols, rows, banner ? 0.86 : 0.9, site.mark)
      window.ogReady = true
    </script>
  </body>
</html>
