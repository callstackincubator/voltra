buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.0.0"
    classpath "org.jetbrains.kotlin:kotlin-serialization:2.0.21"
  }

  ext.safeExtGet = { prop, fallback ->
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
  }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'
apply plugin: 'com.facebook.react'

def safeExtGet = { prop, fallback ->
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

// Mirror the app's ABI selection (React Native template convention) so the
// standalone Hermes runtime is only built for the architectures the app ships.
def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

// Read version from package.json for BuildConfig
def packageJsonFile = new File(project.projectDir.parentFile, "package.json")
def packageJson = new groovy.json.JsonSlurper().parseText(packageJsonFile.text)
def voltraVersion = packageJson.version

def hostMinSdk = safeExtGet("minSdkVersion", 24)
if (hostMinSdk < 24) {
  throw new GradleException(
    "@use-voltra/android-client requires minSdkVersion 24 (Android 7.0); this app sets ${hostMinSdk}."
  )
}

android {
  namespace "voltra"

  compileSdkVersion safeExtGet("compileSdkVersion", 36)

  defaultConfig {
    minSdkVersion hostMinSdk
    targetSdkVersion safeExtGet("targetSdkVersion", 36)
    versionCode 1
    versionName "0.1.0"
    buildConfigField "String", "VOLTRA_VERSION", "\"${voltraVersion}\""

    // Standalone Hermes runtime for Dynamic Widgets, via custom JNI.
    // See CMakeLists.txt / src/main/cpp/voltra_js_renderer.cpp.
    externalNativeBuild {
      cmake {
        cppFlags "-std=c++17", "-fexceptions", "-frtti"
        arguments "-DANDROID_STL=c++_shared"
      }
    }

    ndk {
      abiFilters(*reactNativeArchitectures())
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  buildFeatures {
    buildConfig true
    compose true
    // Required to consume React Native's published prefab modules (jsi, hermes, fbjni).
    prefab true
  }

  packagingOptions {
    // These .so files are already provided by the host app's React Native runtime;
    // bundling Voltra's copies would cause duplicate-library conflicts at install time.
    excludes += [
      "**/libreact_nativemodule_core.so",
      "**/libfbjni.so",
      "**/libjsi.so",
      "**/libhermes.so",
      "**/libhermesvm.so",
    ]
  }

  lintOptions {
    abortOnError false
  }

  testOptions {
    unitTests.includeAndroidResources = true
    unitTests.all {
      testLogging {
        events "passed", "failed", "skipped"
        exceptionFormat "full"
        showCauses true
        showExceptions true
        showStackTraces true
      }
    }
  }
}

dependencies {
  // React Native
  implementation "com.facebook.react:react-android"
  // Provides the `hermes-engine` prefab (libhermes on RN <= 0.81, libhermesvm on RN >= 0.82)
  // that CMakeLists.txt's find_package(hermes-engine) consumes for the standalone Hermes JS
  // runtime. Without it the native build fails to configure in release variants (react-android
  // alone does not publish the Hermes prefab). Version is substituted by the React Native
  // Gradle Plugin (applied above).
  implementation "com.facebook.react:hermes-android"

  // Jetpack Glance
  api "androidx.glance:glance:1.2.0-rc01"
  api "androidx.glance:glance-appwidget:1.2.0-rc01"

  // Compose runtime (required for Glance)
  api "androidx.compose.runtime:runtime:1.6.8"

  // Material3 — used to read Material You dynamic color tokens for Dynamic Widgets'
  // env.materialColors (dynamicLightColorScheme / dynamicDarkColorScheme).
  implementation "androidx.compose.material3:material3:1.3.2"

  // WorkManager (for periodic server-driven widget updates)
  api "androidx.work:work-runtime-ktx:2.9.1"

  // DataStore (credential storage for widget server updates)
  api "androidx.datastore:datastore-preferences:1.1.4"

  // Google Tink (encryption for credential storage)
  implementation "com.google.crypto.tink:tink-android:1.19.0"

  // Coroutines
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

  // Kotlinx Serialization
  implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3"

  // SVG rasterization for runtime image preloading
  implementation "com.caverock:androidsvg-aar:1.4"

  // Unit tests
  testImplementation "junit:junit:4.13.2"
  testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1"
  testImplementation "org.robolectric:robolectric:4.14.1"
}
