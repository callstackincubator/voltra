name: CI

on:
  push:
    branches:
      - main
  # No `branches` filter: stacked PRs (e.g. via gh-stack) target another
  # feature branch instead of `main`, and the filter would otherwise stop
  # this workflow from ever running for them.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js-lint:
    name: '[JS] Format & Lint'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check JS formatting
        run: pnpm run format:js:check

      - name: Run JS linter
        run: pnpm run lint:libOnly

  js-build:
    name: '[JS] Build'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build JS packages
        run: pnpm run build:all

  typecheck:
    name: '[JS] Types validation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type check
        run: pnpm run typecheck

  test:
    name: '[JS] Test'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run JS tests via Turbo
        run: pnpm run test:js

  native-kotlin-test:
    name: '[Kotlin] Test'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build monorepo
        run: pnpm run build:all

      - name: Generate Android native project
        working-directory: example
        run: CI=1 pnpm exec expo prebuild --platform android

      - name: Run Kotlin native tests
        working-directory: example/android
        run: ./gradlew :use-voltra_android-client:testDebugUnitTest

      - name: Run Android Lint
        working-directory: example/android
        run: ./gradlew :use-voltra_android-client:lintDebug -PvoltraLintStrict

  native-swift-test:
    name: '[Swift] Test'
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Swift native tests
        run: pnpm run test:swift

  swiftformat:
    name: '[Swift] Format & Lint'
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: 'pnpm'

      - name: Check Swift formatting
        run: pnpm run format:swift:check

  ktlint:
    name: '[Kotlin] Format & Lint'
    runs-on: ubuntu-latest
    env:
      KTLINT_VERSION: 1.8.0
      KTLINT_SHA256: a3fd620207d5c40da6ca789b95e7f823c54e854b7fade7f613e91096a3706d75
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: 'pnpm'

      # Downloading the pinned release binary is much faster in CI than installing ktlint via Homebrew.
      - name: Install ktlint
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL \
            "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSION}/ktlint" \
            -o "$RUNNER_TEMP/bin/ktlint"
          echo "${KTLINT_SHA256}  $RUNNER_TEMP/bin/ktlint" | sha256sum --check --
          chmod +x "$RUNNER_TEMP/bin/ktlint"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Check ktlint version
        run: ktlint --version

      - name: Check Kotlin formatting
        run: pnpm run format:kotlin:check

  android-tarball-build:
    name: '[Android] Tarball + all-ABI native build'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # build/** must exist so the packed tarball is complete.
      - name: Build monorepo
        run: pnpm run build:all

      # Packaging integrity: pack android-client and install the *tarball* into
      # the example app instead of the workspace symlink. `pnpm pack` rewrites
      # the `workspace:` deps to real version ranges that match the sibling
      # packages, so pnpm links those from the workspace while android-client
      # itself is consumed exactly as it would ship to npm. A file missing from
      # the tarball (the v2.1.0 CMakeLists.txt incident) then breaks prebuild or
      # gradle configure below.
      - name: Pack android-client tarball
        working-directory: packages/android-client
        run: |
          mkdir -p "$RUNNER_TEMP/tarballs"
          pnpm pack --pack-destination "$RUNNER_TEMP/tarballs"
          TARBALL=$(ls "$RUNNER_TEMP/tarballs"/*.tgz | head -n1)
          echo "ANDROID_CLIENT_TARBALL=$TARBALL" >> "$GITHUB_ENV"

      # `pnpm pack` rewrites the tarball's `workspace:^` deps to real semver
      # ranges, which pnpm would otherwise resolve from the npm registry —
      # tripping minimumReleaseAge for freshly published versions and testing
      # published siblings instead of this branch. Override every @use-voltra
      # sibling back to the workspace so only android-client itself is consumed
      # from the tarball (it must NOT be overridden, or the tarball install —
      # the whole point of this job — would be replaced by a workspace link).
      - name: Resolve sibling packages from the workspace
        run: |
          {
            echo ""
            echo "overrides:"
            for f in packages/*/package.json; do
              name=$(node -p "require('./$f').name")
              if [ "$name" != "@use-voltra/android-client" ]; then
                echo "  \"$name\": workspace:*"
              fi
            done
          } >> pnpm-workspace.yaml

      - name: Install android-client from tarball into example app
        run: pnpm --filter voltra-example add "file:$ANDROID_CLIENT_TARBALL"

      - name: Generate Android native project
        working-directory: example
        run: CI=1 pnpm exec expo prebuild --platform android

      # All-ABI native build (issue #209): a targeted external-native-build task
      # keeps CI fast while compiling libvoltra_js_renderer.so and linking
      # ReactAndroid::jsi / hermes-engine::hermesvm / fbjni::fbjni for every ABI,
      # so a per-ABI (e.g. armeabi-v7a) link regression fails CI.
      - name: Build native library for all ABIs
        working-directory: example/android
        run: >-
          ./gradlew :use-voltra_android-client:externalNativeBuildDebug
          -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

      - name: Verify 16 KB ELF alignment
        working-directory: example/android
        shell: bash
        run: |
          set -euo pipefail

          android_client_root=$(node -p "require('path').dirname(require.resolve('@use-voltra/android-client/package.json'))")
          readelf_bin=$(find "$ANDROID_HOME/ndk" -path '*/toolchains/llvm/prebuilt/*/bin/llvm-readelf' -print | sort -V | tail -n1)

          if [[ -z "$readelf_bin" ]]; then
            echo "::error::Could not find llvm-readelf in the Android NDK"
            exit 1
          fi

          for abi in arm64-v8a x86_64; do
            library_path=$(find "$android_client_root/android/build/intermediates/cxx" \
              -path "*/obj/$abi/libvoltra_js_renderer.so" -print -quit)

            if [[ -z "$library_path" ]]; then
              echo "::error::Could not find libvoltra_js_renderer.so for $abi"
              exit 1
            fi

            alignments=$("$readelf_bin" -lW "$library_path" | awk '$1 == "LOAD" { print $NF }')
            if [[ -z "$alignments" ]]; then
              echo "::error::No ELF LOAD segments found in $library_path"
              exit 1
            fi

            while IFS= read -r alignment; do
              if (( alignment < 0x4000 )); then
                echo "::error::$library_path has an ELF LOAD segment aligned to $alignment; expected at least 0x4000"
                exit 1
              fi
            done <<< "$alignments"
          done

  ios-example-build:
    name: '[iOS] Example app build (${{ matrix.linkage }})'
    runs-on: macos-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Static libraries are the Expo default; static frameworks is what
        # `ios.useFrameworks: "static"` (common on EAS, e.g. with Firebase)
        # produces. The two layouts resolve pod build products differently, so
        # a podspec that builds in one can still break the other (the 2.3.0
        # duplicated `module_name` incident only surfaced under frameworks).
        linkage: [static-libraries, static-frameworks]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The config plugins run from build/**, so the monorepo must be built
      # before `expo prebuild` can generate the native project.
      - name: Build monorepo
        run: pnpm run build:all

      - name: Generate iOS native project
        working-directory: example
        run: CI=1 pnpm exec expo prebuild --platform ios --no-install

      - name: Install CocoaPods dependencies
        working-directory: example/ios
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        # The Podfile treats an exported USE_FRAMEWORKS as a linkage value and
        # rejects an empty string, so only export it for the frameworks leg.
        run: |
          if [ "${{ matrix.linkage }}" = "static-frameworks" ]; then
            export USE_FRAMEWORKS=static
          fi
          pod install

      # CocoaPods writes a per-user scheme for every development pod, and the
      # `Voltra` pod's scheme shadows the example app's `Voltra` scheme under
      # frameworks linkage, so xcodebuild would silently build only the pod.
      - name: Drop CocoaPods user schemes
        working-directory: example/ios
        run: rm -rf Pods/Pods.xcodeproj/xcuserdata

      # Debug skips Voltra's release widget bundling and Metro is not needed,
      # so this compiles the app, the Live Activity extension, and both
      # Voltra pods exactly as a consumer's `expo run:ios` would.
      - name: Build example app for iOS Simulator
        working-directory: example/ios
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Voltra.xcworkspace \
            -scheme Voltra \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild.log

      # Guard against the build resolving to something other than the app:
      # both Voltra pods only get compiled when the app and its Live Activity
      # extension are in the build graph.
      - name: Verify app and extension were built
        working-directory: example/ios
        run: |
          app=build/DerivedData/Build/Products/Debug-iphonesimulator/Voltra.app
          test -d "$app" || { echo "::error::$app was not built"; exit 1; }
          test -d "$app/PlugIns/VoltraLiveActivity.appex" || { echo "::error::Live Activity extension missing from $app"; exit 1; }

      - name: Upload xcodebuild log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-${{ matrix.linkage }}.log
          path: example/ios/xcodebuild.log
