name: Release

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Release packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      # Installing dependencies runs `lefthook install`, which would otherwise
      # fire the repository's pre-push hooks when this job pushes the release
      # commit. Those hooks run the native test suites, which need macOS and a
      # prebuilt Android project that this runner does not have. The release
      # commit only adds version and changelog changes on top of a commit that
      # required CI checks on main already validated.
      LEFTHOOK: 0
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

    steps:
      - name: Validate release branch
        run: |
          if [ "$GITHUB_REF_TYPE" != "branch" ] || [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Release workflow must run from the main branch." >&2
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.5.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.14.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git identity
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

      - name: Resolve release state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          TAG="v$VERSION"

          # The version on main belongs to a release that is either finished or
          # not. Finished means it reached every place a release ends up: npm,
          # the tag, and the GitHub release. Anything less is a release a
          # previous run started and did not complete, and this run finishes
          # it instead of starting a new one. Checking npm alone is not enough:
          # a run can publish every package and still stop before tagging.
          INCOMPLETE=""

          if NPM_OUTPUT=$(npm view "@use-voltra/core@$VERSION" version 2>&1); then
            :
          elif printf '%s' "$NPM_OUTPUT" | grep -q E404; then
            INCOMPLETE="$INCOMPLETE npm"
          else
            echo "$NPM_OUTPUT" >&2
            echo "Could not check whether version $VERSION is published." >&2
            exit 1
          fi

          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            INCOMPLETE="$INCOMPLETE tag"
          fi

          # Like npm above, only a definite "not found" counts as missing: an API
          # error must not turn a finished release into one this run re-finishes.
          if ! GH_OUTPUT=$(gh release view "$TAG" 2>&1); then
            if printf '%s' "$GH_OUTPUT" | grep -qi "release not found"; then
              INCOMPLETE="$INCOMPLETE github-release"
            else
              echo "$GH_OUTPUT" >&2
              echo "Could not check whether GitHub release $TAG exists." >&2
              exit 1
            fi
          fi

          if [ -z "$INCOMPLETE" ]; then
            echo "RELEASE_RETRY=false" >> "$GITHUB_ENV"
            exit 0
          fi

          # Commits may have landed on main since, so the release commit is
          # looked up rather than assumed to be HEAD.
          RELEASE_COMMIT=$(git log -1 --format=%H -E --grep="^chore: release v?${VERSION//./\\.}$")
          if [ -z "$RELEASE_COMMIT" ]; then
            echo "Version $VERSION is missing from:$INCOMPLETE, and no release commit for it exists on main." >&2
            exit 1
          fi

          echo "Finishing release $VERSION from release commit $RELEASE_COMMIT (missing:$INCOMPLETE)."
          {
            echo "RELEASE_RETRY=true"
            echo "RELEASE_VERSION=$VERSION"
            echo "RELEASE_COMMIT=$RELEASE_COMMIT"
          } >> "$GITHUB_ENV"

      - name: Check out release commit
        if: ${{ env.RELEASE_RETRY == 'true' }}
        run: |
          # Publish exactly what the release commit and its tag describe, not
          # whatever landed on main after it.
          git checkout --detach "$RELEASE_COMMIT"
          pnpm install --frozen-lockfile

      - name: Check release plan
        if: ${{ env.RELEASE_RETRY != 'true' }}
        run: |
          pnpm exec changeset status --output=.changeset-release-plan.json
          node <<'NODE'
          const plan = require('./.changeset-release-plan.json')
          const versions = [...new Set(
            plan.releases
              .filter((release) => release.type !== 'none')
              .map((release) => release.newVersion)
              .filter(Boolean)
          )]

          if (versions.length === 0) {
            throw new Error('No packages to release')
          }

          if (versions.length !== 1) {
            throw new Error(`Expected one release version, got: ${versions.join(', ')}`)
          }
          NODE

      - name: Version packages
        if: ${{ env.RELEASE_RETRY != 'true' }}
        run: |
          pnpm run version-packages
          pnpm install --lockfile-only

      - name: Resolve release version
        if: ${{ env.RELEASE_RETRY != 'true' }}
        run: |
          VERSION=$(node <<'NODE'
          const plan = require('./.changeset-release-plan.json')
          const versions = [...new Set(
            plan.releases
              .filter((release) => release.type !== 'none')
              .map((release) => release.newVersion)
              .filter(Boolean)
          )]

          if (versions.length !== 1) {
            throw new Error(`Expected one release version, got: ${versions.join(', ')}`)
          }

          console.log(versions[0])
          NODE
          )
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build packages
        run: |
          # CI already validated the selected source commit. This fresh build
          # creates the package artifacts that Changesets will publish.
          pnpm run build:all

      - name: Commit release changes
        if: ${{ env.RELEASE_RETRY != 'true' }}
        run: |
          git add .changeset packages package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No release changes were staged." >&2
            exit 1
          fi
          git commit -m "chore: release ${RELEASE_VERSION}"
          echo "RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Push release commit
        if: ${{ env.RELEASE_RETRY != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push --no-verify "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

      - name: Publish missing packages
        run: pnpm exec changeset publish --no-git-tag

      - name: Verify published packages
        env:
          VERIFY_TIMEOUT_SECONDS: 900
          VERIFY_POLL_SECONDS: 15
        run: |
          # Changesets can report an error and still exit successfully, so the
          # registry is the source of truth before the release is tagged.
          PACKAGES=$(node <<'NODE'
          const fs = require('fs')
          for (const dir of fs.readdirSync('packages')) {
            const file = `./packages/${dir}/package.json`
            if (!fs.existsSync(file)) continue
            const pkg = require(file)
            if (!pkg.private) console.log(pkg.name)
          }
          NODE
          )

          # npm acknowledges a publish before the version is visible: 2.3.0 took
          # up to three minutes per package to appear. Every package shares one
          # deadline and is checked each round, so waiting on one package never
          # eats into another's time, the way a fixed window per package in
          # sequence did.
          DEADLINE=$(( $(date +%s) + VERIFY_TIMEOUT_SECONDS ))
          MISSING="$PACKAGES"

          while :; do
            STILL_MISSING=""
            for PACKAGE in $MISSING; do
              if ! npm view "$PACKAGE@$RELEASE_VERSION" version >/dev/null 2>&1; then
                STILL_MISSING="$STILL_MISSING $PACKAGE"
              fi
            done
            MISSING="$STILL_MISSING"

            if [ -z "$MISSING" ]; then
              echo "All packages are published at $RELEASE_VERSION."
              break
            fi

            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "Not published at $RELEASE_VERSION after ${VERIFY_TIMEOUT_SECONDS}s:$MISSING" >&2
              echo "Rerun this workflow once they appear: it finishes the release instead of starting a new one." >&2
              exit 1
            fi

            echo "Waiting for:$MISSING"
            sleep "$VERIFY_POLL_SECONDS"
          done

      - name: Create and push release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${RELEASE_VERSION}"
          REMOTE_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          TAG_SHA=$(git ls-remote "$REMOTE_URL" "refs/tags/$TAG^{}" | awk 'NR == 1 { print $1 }')
          if [ -z "$TAG_SHA" ]; then
            TAG_SHA=$(git ls-remote "$REMOTE_URL" "refs/tags/$TAG" | awk 'NR == 1 { print $1 }')
          fi

          if [ -n "$TAG_SHA" ]; then
            if [ "$TAG_SHA" != "$RELEASE_COMMIT" ]; then
              echo "Tag $TAG points to $TAG_SHA, expected $RELEASE_COMMIT." >&2
              exit 1
            fi
            echo "Tag $TAG already exists on the release commit."
          else
            git tag -a "$TAG" "$RELEASE_COMMIT" -m "Release $TAG"
            git push --no-verify "$REMOTE_URL" "refs/tags/$TAG"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${RELEASE_VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists."
          else
            gh release create "$TAG" \
              --verify-tag \
              --generate-notes \
              --latest
          fi
